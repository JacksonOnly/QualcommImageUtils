name: CI and Publish Native AOT

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

concurrency:
  group: native-aot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version_date: ${{ steps.version.outputs.version_date }}
      version_hash: ${{ steps.version.outputs.version_hash }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate version
        id: version
        shell: pwsh
        run: |
          $versionDate = [DateTime]::UtcNow.ToString(
            'yyyy.M.d',
            [System.Globalization.CultureInfo]::InvariantCulture)
          $versionHash = '${{ github.sha }}'.Substring(0, 7)
          $version = "$versionDate-g$versionHash"

          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VersionDate=$versionDate"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VersionHash=$versionHash"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version_date=$versionDate"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version_hash=$versionHash"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"

          Write-Host "Build version: $version"

      - name: Restore
        run: dotnet restore QualcommImageUtils.slnx

      - name: Build
        run: dotnet build QualcommImageUtils.slnx -c Release --no-restore

      - name: Test
        run: dotnet test QualcommImageUtils.slnx -c Release --no-build --no-restore

      - name: Verify formatting
        run: dotnet format QualcommImageUtils.slnx --verify-no-changes --no-restore --verbosity minimal

  publish:
    name: Publish ${{ matrix.rid }}
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VersionDate: ${{ needs.ci.outputs.version_date }}
      VersionHash: ${{ needs.ci.outputs.version_hash }}
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-arm64
          - win-x64
          - win-x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore QcomImageUtils.App/QcomImageUtils.App.csproj -r ${{ matrix.rid }}

      - name: Publish Native AOT
        id: publish
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $version = '${{ needs.ci.outputs.version }}'
          $project = Join-Path $env:GITHUB_WORKSPACE 'QcomImageUtils.App\QcomImageUtils.App.csproj'
          $output = Join-Path $env:GITHUB_WORKSPACE "artifacts\$rid"

          dotnet publish $project `
            --configuration Release `
            --runtime $rid `
            --self-contained true `
            --no-restore `
            --output $output

          if ($LASTEXITCODE -ne 0) {
            throw "Publish $rid failed with exit code $LASTEXITCODE."
          }

          $source = Join-Path $output 'QcomImageUtils.App.exe'
          $fileName = "QcomImageUtils.App_${rid}_aot_${version}.exe"
          $destination = Join-Path $output $fileName
          Move-Item -LiteralPath $source -Destination $destination -Force

          $artifactName = [System.IO.Path]::GetFileNameWithoutExtension($fileName)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "file_name=$fileName"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "artifact_name=$artifactName"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.publish.outputs.artifact_name }}
          path: artifacts/${{ matrix.rid }}/${{ steps.publish.outputs.file_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
